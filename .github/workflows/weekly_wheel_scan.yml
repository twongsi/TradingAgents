name: Weekly EMA100/200 & Options Wheel Portfolio Scanner

# Runs only when started by hand (Actions tab -> this workflow -> Run workflow).
# No schedule: nothing runs, commits or messages without the owner starting it.
on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "วันที่ต้องการสแกน (YYYY-MM-DD) เว้นว่างเพื่อใช้วันปัจจุบัน"
        required: false
        default: ""
      dte_days:
        description: "อายุสัญญาออปชันเป้าหมาย (DTE)"
        required: false
        default: "35"

permissions:
  contents: write

jobs:
  weekly-wheel-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Python 3.11 & Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: 3.5 Run Wheel Unit Tests
        run: |
          pytest tests/test_quant_wheel_tools.py tests/test_wheel_strategy_wiring.py -v

      - name: 4. Run Weekly EMA100/200 & Dual-Market Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADE_DATE_INPUT: ${{ github.event.inputs.trade_date }}
          DTE_INPUT: ${{ github.event.inputs.dte_days }}
        run: |
          SCAN_DATE="${TRADE_DATE_INPUT:-$(date -u +"%Y-%m-%d")}"
          DTE="${DTE_INPUT:-35}"
          [[ "$SCAN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad trade_date: $SCAN_DATE"; exit 1; }
          [[ "$DTE" =~ ^[0-9]{1,3}$ ]] || { echo "bad dte_days: $DTE"; exit 1; }

          python wheel_full_cycle_scanner.py --date "${SCAN_DATE}" --dte "${DTE}" --output-dir reports --notify-telegram
          python dual_market_wheel_dividend_scanner.py --date "${SCAN_DATE}" --output-dir reports

          mkdir -p docs
          cp reports/latest_wheel_scan.json docs/latest_wheel_scan.json

      - name: 5. Publish Table to GitHub Actions Job Summary
        run: |
          if [ -f "reports/latest_wheel_scan.md" ]; then
            cat reports/latest_wheel_scan.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: 6. Upload Scan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-wheel-scan-report
          path: reports/
          retention-days: 90

      # reports/ is gitignored and kept as the artifact above; only the
      # dashboard's JSON is committed, to the branch the run was started on.
      - name: 7. Commit & Push Dashboard Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/latest_wheel_scan.json
          if git diff --staged --quiet; then
            echo "ไม่มีการเปลี่ยนแปลงใน docs/latest_wheel_scan.json"
          else
            git commit -m "chore(scan): automated Weekly EMA & Wheel scan report [skip ci]"
            git push
          fi
